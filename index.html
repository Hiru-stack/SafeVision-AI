<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SafeVision AI - Helmet Detection</title>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 40px auto;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #22c55e;
            color: white;
            margin: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        #status {
            margin: 20px;
            font-weight: bold;
        }

        .canvas-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 12px;
        }

        .results {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .result-box {
            background: #334155;
            padding: 18px;
            border-radius: 10px;
        }

        .result-number {
            font-size: 30px;
            font-weight: bold;
        }

        .safe {
            color: #22c55e;
        }

        .danger {
            color: #ef4444;
        }

        .warning {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        @media(max-width:600px) {

            h1 {
                font-size: 30px;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🦺 SafeVision AI</h1>

    <p class="subtitle">
        AI-Powered Helmet Safety Detection using YOLO11
    </p>

    <div class="card">

        <h2>Upload an Image</h2>

        <p>
            Upload a motorcycle / helmet image and let the AI analyse it.
        </p>

        <input
            type="file"
            id="imageUpload"
            accept="image/*"
        >

        <br>

        <button
            id="detectButton"
            onclick="detectObjects()"
            disabled
        >
            Detect Helmets
        </button>

        <div id="status">
            Loading AI model...
        </div>

        <div class="canvas-container">

            <canvas
                id="canvas"
                width="640"
                height="640"
            ></canvas>

        </div>

        <div class="results">

            <div class="result-box">

                <div class="result-number safe" id="withHelmet">
                    0
                </div>

                <div>
                    With Helmet
                </div>

            </div>


            <div class="result-box">

                <div class="result-number danger" id="withoutHelmet">
                    0
                </div>

                <div>
                    Without Helmet
                </div>

            </div>


            <div class="result-box">

                <div class="result-number" id="total">
                    0
                </div>

                <div>
                    Total Detected
                </div>

            </div>

        </div>

        <div
            id="safetyMessage"
            class="warning"
        ></div>

    </div>

</div>


<script>

let session = null;

let uploadedImage = null;

const MODEL_SIZE = 640;

const CLASS_NAMES = [
    "Without Helmet",
    "With Helmet"
];


// ------------------------------
// LOAD MODEL
// ------------------------------

async function loadModel() {

    const status = document.getElementById("status");

    try {

        status.innerText = "Loading YOLO model...";

        session =
            await ort.InferenceSession.create(
                "./best.onnx",
                {
                    executionProviders: ["wasm"]
                }
            );

        status.innerText =
            "✅ AI model loaded successfully";

        document.getElementById(
            "detectButton"
        ).disabled = false;

        console.log(
            "Model input:",
            session.inputNames
        );

        console.log(
            "Model output:",
            session.outputNames
        );

    }

    catch(error) {

        console.error(error);

        status.innerText =
            "❌ Failed to load AI model";

    }

}


// ------------------------------
// IMAGE UPLOAD
// ------------------------------

document.getElementById(
    "imageUpload"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                const img =
                    new Image();

                img.onload =
                    function() {

                        uploadedImage = img;

                        drawOriginalImage();

                    };

                img.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


// ------------------------------
// DRAW IMAGE
// ------------------------------

function drawOriginalImage() {

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

    canvas.width =
        MODEL_SIZE;

    canvas.height =
        MODEL_SIZE;

    ctx.clearRect(
        0,
        0,
        MODEL_SIZE,
        MODEL_SIZE
    );

    ctx.drawImage(
        uploadedImage,
        0,
        0,
        MODEL_SIZE,
        MODEL_SIZE
    );

}


// ------------------------------
// PREPROCESS IMAGE
// ------------------------------

function preprocessImage() {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        MODEL_SIZE;

    canvas.height =
        MODEL_SIZE;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        uploadedImage,
        0,
        0,
        MODEL_SIZE,
        MODEL_SIZE
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            MODEL_SIZE,
            MODEL_SIZE
        );

    const data =
        imageData.data;

    const floatData =
        new Float32Array(
            3 *
            MODEL_SIZE *
            MODEL_SIZE
        );


    for (
        let i = 0;
        i < MODEL_SIZE * MODEL_SIZE;
        i++
    ) {

        floatData[i] =
            data[i * 4] / 255.0;

        floatData[
            MODEL_SIZE *
            MODEL_SIZE + i
        ] =
            data[i * 4 + 1] / 255.0;

        floatData[
            2 *
            MODEL_SIZE *
            MODEL_SIZE + i
        ] =
            data[i * 4 + 2] / 255.0;

    }


    return new ort.Tensor(
        "float32",
        floatData,
        [
            1,
            3,
            MODEL_SIZE,
            MODEL_SIZE
        ]
    );

}


// ------------------------------
// IOU
// ------------------------------

function calculateIOU(a, b) {

    const x1 =
        Math.max(a.x1, b.x1);

    const y1 =
        Math.max(a.y1, b.y1);

    const x2 =
        Math.min(a.x2, b.x2);

    const y2 =
        Math.min(a.y2, b.y2);


    const intersection =
        Math.max(0, x2 - x1) *
        Math.max(0, y2 - y1);


    const areaA =
        (a.x2 - a.x1) *
        (a.y2 - a.y1);

    const areaB =
        (b.x2 - b.x1) *
        (b.y2 - b.y1);


    return intersection /
        (
            areaA +
            areaB -
            intersection +
            1e-6
        );

}


// ------------------------------
// NMS
// ------------------------------

function nonMaximumSuppression(
    boxes,
    iouThreshold = 0.45
) {

    boxes.sort(
        (a, b) =>
            b.confidence -
            a.confidence
    );


    const selected = [];


    while (boxes.length > 0) {

        const current =
            boxes.shift();

        selected.push(current);


        boxes =
            boxes.filter(box => {

                if (
                    box.classId !==
                    current.classId
                ) {
                    return true;
                }

                return (
                    calculateIOU(
                        current,
                        box
                    ) < iouThreshold
                );

            });

    }


    return selected;

}


// ------------------------------
// PROCESS YOLO OUTPUT
// ------------------------------

function processOutput(
    output,
    confidenceThreshold = 0.40
) {

    const data =
        output.data;

    const dims =
        output.dims;


    console.log(
        "Output dimensions:",
        dims
    );


    const numFeatures =
        dims[1];

    const numBoxes =
        dims[2];


    const detections = [];


    for (
        let i = 0;
        i < numBoxes;
        i++
    ) {

        const x =
            data[0 * numBoxes + i];

        const y =
            data[1 * numBoxes + i];

        const width =
            data[2 * numBoxes + i];

        const height =
            data[3 * numBoxes + i];


        let bestScore = 0;
        let bestClass = -1;


        for (
            let c = 4;
            c < numFeatures;
            c++
        ) {

            const score =
                data[c * numBoxes + i];

            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                bestClass =
                    c - 4;

            }

        }


        if (
            bestScore <
            confidenceThreshold
        ) {
            continue;
        }


        detections.push({

            x1:
                x - width / 2,

            y1:
                y - height / 2,

            x2:
                x + width / 2,

            y2:
                y + height / 2,

            confidence:
                bestScore,

            classId:
                bestClass

        });

    }


    return nonMaximumSuppression(
        detections
    );

}


// ------------------------------
// DRAW DETECTIONS
// ------------------------------

function drawDetections(
    detections
) {

    drawOriginalImage();


    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");


    ctx.lineWidth = 4;

    ctx.font =
        "18px Arial";


    detections.forEach(
        detection => {

            const {
                x1,
                y1,
                x2,
                y2,
                confidence,
                classId
            } = detection;


            const width =
                x2 - x1;

            const height =
                y2 - y1;


            if (classId === 0) {

                ctx.strokeStyle =
                    "#ef4444";

                ctx.fillStyle =
                    "#ef4444";

            }

            else {

                ctx.strokeStyle =
                    "#22c55e";

                ctx.fillStyle =
                    "#22c55e";

            }


            ctx.strokeRect(
                x1,
                y1,
                width,
                height
            );


            const label =
                CLASS_NAMES[classId] +
                " " +
                (
                    confidence * 100
                ).toFixed(1) +
                "%";


            const textWidth =
                ctx.measureText(
                    label
                ).width;


            ctx.fillRect(
                x1,
                Math.max(
                    0,
                    y1 - 25
                ),
                textWidth + 12,
                25
            );


            ctx.fillStyle =
                "white";


            ctx.fillText(
                label,
                x1 + 6,
                Math.max(
                    18,
                    y1 - 6
                )
            );

        }
    );

}


// ------------------------------
// RUN DETECTION
// ------------------------------

async function detectObjects() {

    if (!uploadedImage) {

        alert(
            "Please upload an image first."
        );

        return;

    }


    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "🔍 Analysing image...";


    try {

        const tensor =
            preprocessImage();


        const feeds = {};

        feeds[
            session.inputNames[0]
        ] = tensor;


        const results =
            await session.run(feeds);


        const output =
            results[
                session.outputNames[0]
            ];


        const detections =
            processOutput(
                output,
                0.40
            );


        drawDetections(
            detections
        );


        let withHelmet = 0;

        let withoutHelmet = 0;


        detections.forEach(
            detection => {

                if (
                    detection.classId === 0
                ) {

                    withoutHelmet++;

                }

                else if (
                    detection.classId === 1
                ) {

                    withHelmet++;

                }

            }
        );


        document.getElementById(
            "withHelmet"
        ).innerText =
            withHelmet;


        document.getElementById(
            "withoutHelmet"
        ).innerText =
            withoutHelmet;


        document.getElementById(
            "total"
        ).innerText =
            detections.length;


        const message =
            document.getElementById(
                "safetyMessage"
            );


        if (
            withoutHelmet > 0
        ) {

            message.innerHTML =
                "⚠️ Safety Alert: " +
                withoutHelmet +
                " person(s) detected without helmet.";

            message.style.background =
                "#7f1d1d";

        }

        else if (
            withHelmet > 0
        ) {

            message.innerHTML =
                "✅ Helmet compliance detected.";

            message.style.background =
                "#14532d";

        }

        else {

            message.innerHTML =
                "No helmet-related objects detected.";

            message.style.background =
                "#334155";

        }


        status.innerText =
            "✅ Detection completed";

    }

    catch(error) {

        console.error(error);

        status.innerText =
            "❌ Detection failed. Check browser console.";

    }

}


// Start model
loadModel();

</script>

</body>

</html>
